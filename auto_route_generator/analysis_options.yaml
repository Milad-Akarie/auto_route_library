include: package:very_good_analysis/analysis_options.yaml

# The repository's own formatter settings, kept from before very_good_analysis.
formatter:
  page_width: 80

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # A build directory is output, and analysing it says nothing about the
    # code that produced it.
    - build/**
    # Written by auto_route_generator: its output is proven by the generator's
    # tests, and a lint fix here would be overwritten on the next build.
    - "**/*.gr.dart"
    - "**/*.g.dart"
  # The template's two `errors:` lines are left out: they exist for Riverpod
  # and Freezed, and this package uses neither.

linter:
  rules:
    # A published package: every public member is documented on pub.dev,
    # as the repository required before very_good_analysis.
    public_member_api_docs: true

# Learn more: https://dcm.dev/docs/individuals/configuration
dart_code_metrics:
  extends:
    - recommended
  metrics:
    lines-of-code:
      threshold: 100
    cyclomatic-complexity:
      threshold: 20
    number-of-parameters:
      threshold: 10
    maximum-nesting-level:
      threshold: 5
    widgets-nesting-level:
      threshold: 10
    weighted-methods-per-class:
      threshold: 35
    technical-debt:
      threshold: 1
      todo-cost: 161
      ignore-cost: 320
      ignore-for-file-cost: 396
      as-dynamic-cost: 322
      deprecated-annotations-cost: 37
      file-nullsafety-migration-cost: 41
      unit-type: "USD"
  metrics-exclude:
    - test/**
    - build/**
    - "**/*.g.dart"
    - "**/*.gr.dart"
  # The analyzer's exclusions, repeated: DCM does not read them.
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.gr.dart"
  rules:
    - prefer-single-widget-per-file
    - prefer-trailing-comma
    - unnecessary-trailing-comma
    - avoid-inferrable-type-arguments
    # Phil, 2026-11-06: "lets do without var renaming as it is too much of a change, we can disable this rule for now."
    - prefer-boolean-prefixes: false
    - avoid-unsafe-collection-methods
    - avoid-dynamic
    - avoid-duplicate-constant-values
    - prefer-match-file-name
    - avoid-duplicate-test-assertions
    - avoid-empty-test-groups
    - avoid-shadowing
    - avoid-nullable-interpolation
    - avoid-commented-out-code
    - prefer-prefixed-global-constants
    - avoid-unnecessary-extends
    - avoid-redundant-async
    - prefer-declaring-const-constructor
    - match-getter-setter-field-names
    - avoid-empty-setstate
    - move-variable-closer-to-its-usage
    - avoid-passing-async-when-sync-expected
    - avoid-passing-self-as-argument
    - avoid-accessing-collections-by-constant-index
    - avoid-wildcard-cases-with-enums
    - avoid-default-tostring
    - prefer-null-aware-spread
    - no-empty-block
    # Phil, 2026-11-06: "lets do without var renaming as it is too much of a change, we can disable this rule for now."
    - prefer-correct-callback-field-name: false
    # Left on, unlike the template: its reason was Riverpod's fixed
    # signatures, and DCM already skips overrides.
    - avoid-unused-parameters: true
    - no-boolean-literal-compare: true
    - double-literal-format: true
    - avoid-unused-assignment: true
    - avoid-unnecessary-reassignment: true
    - avoid-unnecessary-stateful-widgets: true
    - function-always-returns-null: true
    - avoid-unnecessary-local-late: true
    - avoid-self-compare: true
    - avoid-duplicate-initializers: true
    - avoid-unremovable-callbacks-in-listeners: true
    # The template's `avoid-returning-widgets` and `banned-usage` lines are
    # left out: the generator is plain Dart and has no widgets.
