include: package:very_good_analysis/analysis_options.yaml

# CLAUDE DO NOT EDIT THIS FILE. IT IS IMPORTANT TO KEEP IT AS IS.

# The repository's house style is 80 columns.
formatter:
  page_width: 80

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # A build directory is output, and analysing it says nothing about the
    # code that produced it.
    - build/**
    # The example app is its own package, with its own analysis options.
    - example/**
    - example.old/**
    # Written by auto_route_generator: its output is proven by the generator's
    # tests, and a lint fix here would be overwritten on the next build.
    - "**/*.gr.dart"
    - "**/*.g.dart"
  # The template's two `errors:` lines are left out: they exist for Riverpod
  # and Freezed, and this package uses neither.
  errors:
    # Reason: avoid warnings in documentation comments.
    lines_longer_than_80_chars: ignore


linter:
  rules:
    # A published package: every public member is documented on pub.dev,
    # as the repository required before very_good_analysis.
    public_member_api_docs: true
    # Reason: avoid warnings in documentation comments.
    lines_longer_than_80_chars: false 

# Learn more: https://dcm.dev/docs/individuals/configuration
dart_code_metrics:
  extends:
    - recommended
  metrics:
    lines-of-code:
      threshold: 100
    cyclomatic-complexity:
      threshold: 20
    number-of-parameters:
      threshold: 10
    maximum-nesting-level:
      threshold: 5
    widgets-nesting-level:
      threshold: 10
    weighted-methods-per-class:
      threshold: 35
    technical-debt:
      threshold: 1
      todo-cost: 161
      ignore-cost: 320
      ignore-for-file-cost: 396
      as-dynamic-cost: 322
      deprecated-annotations-cost: 37
      file-nullsafety-migration-cost: 41
      unit-type: "USD"
  metrics-exclude:
    - test/**
    - build/**
    - "**/*.g.dart"
    - "**/*.gr.dart"
  # The analyzer's exclusions, repeated: DCM does not read them.
  exclude:
    - build/**
    - example/**
    - example.old/**
    - "**/*.g.dart"
    - "**/*.gr.dart"
  rules:
    - prefer-single-widget-per-file: false
    - prefer-correct-callback-field-name: false
    - prefer-prefixed-global-constants: false
    - prefer-match-file-name: false
    - banned-usage:
        entries:
          - type: Widget
          - ident: Container
            description: >-
              Avoid Container. Use SizedBox, ColoredBox or DecoratedBox, which
              say which of Container's jobs is actually wanted.
