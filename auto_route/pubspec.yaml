name: auto_route
description: AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated for you.
version: 12.0.0
homepage: https://github.com/Milad-Akarie/auto_route_library
screenshots:
  - description: 'Auto Route Logo'
    path: art/auto_route_logo.png
topics:
  - navigation
  - routing
  - auto-route
  - nested-navigation
  - deep-linking

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  web: ^1.0.0
  collection: ^1.18.0
  meta: ^1.16.0


  cupertino_ui: any
  material_ui: any
dev_dependencies:
  benchmark_harness: ^2.4.0
  build_runner:
  mockito: ^5.6.1
  auto_route_generator: ^11.0.0
  flutter_test:
    sdk: flutter
  leak_tracker: ^11.0.2
  leak_tracker_flutter_testing: ^3.0.10
  very_good_analysis: ^11.0.0
