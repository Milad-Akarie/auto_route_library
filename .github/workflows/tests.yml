# Proves every fix in this fork on each platform, on every push and pull
# request: the headless tests on the Dart VM and in Chrome, then the example
# app's integration tests (auto_route/example/integration_test) on an Android
# emulator, an iOS simulator, web through `flutter drive`, and macOS desktop.
# Every job stops after 15 minutes. The macOS jobs run on arm64 runners;
# Intel macOS isn't supported.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  analyze-and-headless:
    name: Analyze and headless tests (VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyze the package
        working-directory: auto_route
        run: flutter analyze
      - name: Analyze the example app and its integration tests
        working-directory: auto_route/example
        run: flutter analyze
      - name: Headless tests on the VM
        working-directory: auto_route
        # bash adds pipefail, so the step fails with the tests despite tee.
        shell: bash
        run: flutter test --reporter github --file-reporter "json:$RUNNER_TEMP/test-results.json" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # The job logs need a sign-in; annotations and the summary don't.
      - name: Name each failed test
        if: failure()
        working-directory: auto_route
        run: python3 ../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"

  headless-chrome:
    name: Headless tests in Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Headless tests in Chrome
        working-directory: auto_route
        shell: bash
        run: flutter test --reporter github --platform chrome --file-reporter "json:$RUNNER_TEMP/test-results.json" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # The job logs need a sign-in; annotations and the summary don't.
      - name: Name each failed test
        if: failure()
        working-directory: auto_route
        run: python3 ../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"

  android:
    name: Integration tests on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: auto_route/example
          # The action runs each line with sh; bash adds pipefail, so the step fails with the tests despite tee.
          script: bash -o pipefail -c 'flutter test --reporter github --file-reporter "json:$RUNNER_TEMP/test-results.json" integration_test/all_tests.dart -d emulator-5554 2>&1 | tee "$RUNNER_TEMP/test-output.txt"'
      # The job logs need a sign-in; annotations and the summary don't.
      - name: Name each failed test
        if: failure()
        working-directory: auto_route/example
        run: python3 ../../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"

  ios:
    name: Integration tests on iOS
    runs-on: macos-26
    timeout-minutes: 15
    # GitHub never picked up an arm64 macOS runner in five runs; the maintainer's Mac runs iOS and macOS before every merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(iphones[-1]["udid"])
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Integration tests on the iOS simulator
        working-directory: auto_route/example
        shell: bash
        run: flutter test --reporter github --file-reporter "json:$RUNNER_TEMP/test-results.json" integration_test/all_tests.dart -d "$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # The job logs need a sign-in; annotations and the summary don't.
      - name: Name each failed test
        if: failure()
        working-directory: auto_route/example
        run: python3 ../../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"

  web:
    name: Integration tests on web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The runner image ships ChromeDriver matching its Chrome.
      - name: Start ChromeDriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 2
      - name: Integration tests in headless Chrome
        working-directory: auto_route/example
        shell: bash
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/all_tests.dart
          -d web-server
          --browser-name=chrome
          --headless 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # flutter drive writes no results file, so this names the failure by its last lines.
      - name: Name the failure
        if: failure()
        working-directory: auto_route/example
        run: python3 ../../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"

  macos:
    name: Integration tests on macOS
    runs-on: macos-26
    timeout-minutes: 15
    # GitHub never picked up an arm64 macOS runner in five runs; the maintainer's Mac runs iOS and macOS before every merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Integration tests on macOS desktop
        working-directory: auto_route/example
        shell: bash
        run: flutter test --reporter github --file-reporter "json:$RUNNER_TEMP/test-results.json" integration_test/all_tests.dart -d macos 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # The job logs need a sign-in; annotations and the summary don't.
      - name: Name each failed test
        if: failure()
        working-directory: auto_route/example
        run: python3 ../../.github/scripts/report_failed_tests.py "$RUNNER_TEMP/test-results.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-output.txt"
